<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block title %}{% endblock %} | AI Detector</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    </head>
    <body>
        <header class="site-header">
            <div class="wrap">
                <a class="brand" href="/">ALL in ONE AI-detector</a>
            </div>
        </header>

        <main class="wrap">
            {% block main %}{% endblock %}
        </main>

        <footer class="site-footer">
            <div class="wrap">
                AI detectors make mistakes, especially on short text and on writing by non-native English speakers.
            </div>
        </footer>
    </body>
</html>
